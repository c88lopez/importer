# Tests the code, then builds the image and pushes it to GitHub Container Registry.
#
#   push to main      -> ghcr.io/<owner>/importer-worker:main, :sha-<short>
#   push tag v1.2.3   -> ghcr.io/<owner>/importer-worker:1.2.3, :1.2, :latest
#   pull request      -> build only, nothing is pushed
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write # lets GITHUB_TOKEN push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/importer-worker

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway Postgres and RabbitMQ so the database and consumer tests run
    # here too (they skip without TEST_DATABASE_URL/TEST_RABBITMQ_URL).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: importer
          POSTGRES_PASSWORD: importer
          POSTGRES_DB: importer_worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U importer -d importer_worker_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
      rabbitmq:
        image: rabbitmq:4.3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://importer:importer@localhost:5432/importer_worker_test?sslmode=disable
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -v ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Turns the git ref into image tags (and OCI labels linking the image to this repo).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The cluster node is amd64; arm64 lets you run the same image on your Mac.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
