# Tests the code, then builds one image per service and pushes them to
# GitHub Container Registry. All services share the version.
#
#   push to main      -> ghcr.io/<owner>/importer-{api,worker,graphql}:main, :sha-<short>
#   push tag v1.2.3   -> ghcr.io/<owner>/importer-{api,worker,graphql}:1.2.3, :1.2, :latest
#   pull request      -> build only, nothing is pushed
name: build

# Only when something that goes into the images or the tests changes: a
# commit that only touches manifests (Argo CD deploys those), docs or request
# files runs nothing. Path filters don't apply to tags, so a release always
# builds.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: &non-code
      - "k8s/**"
      - "httpRequests/**"
      - "**.md"
  pull_request:
    paths-ignore: *non-code

permissions:
  contents: read
  packages: write # lets GITHUB_TOKEN push to ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway Postgres, RabbitMQ and Redis so their tests run here too
    # (they skip without TEST_DATABASE_URL/TEST_RABBITMQ_URL/TEST_REDIS_URL).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: importer
          POSTGRES_PASSWORD: importer
          POSTGRES_DB: importer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U importer -d importer_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
      rabbitmq:
        image: rabbitmq:4.3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://importer:importer@localhost:5432/importer_test?sslmode=disable
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The GraphQL code generated from the schema must be committed and current.
      - name: gqlgen generate is up to date
        run: make generate && git diff --exit-code
      # -p 1: packages share the test database, so run them one at a time.
      - run: go test -v -p 1 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # Build each image even if another fails, so one problem doesn't hide another.
      fail-fast: false
      matrix:
        app: [api, worker, graphql]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/importer-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      # Turns the git ref into image tags (and OCI labels linking the image to this repo).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The cluster node is amd64; arm64 lets you run the same image on your Mac.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP=${{ matrix.app }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
