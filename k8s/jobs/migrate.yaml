# A Job runs a pod to completion once, instead of keeping it running like a
# Deployment. This one applies pending database migrations before a deploy.
#
# It's an Argo CD PreSync hook: every sync runs it (recreating the previous
# one first) before applying anything else, and stops the sync if it fails, so
# the services of a version always find the schema they expect. Its image tag
# comes from k8s/kustomization.yaml, like the services'.
apiVersion: batch/v1
kind: Job
metadata:
  name: importer-api-migrate
  namespace: importer
  labels:
    app: importer-api
    component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0 # a failed migration needs a human, not a retry
  activeDeadlineSeconds: 600 # kill a migration that hangs (e.g. waiting on a table lock)
  ttlSecondsAfterFinished: 86400 # keep the pod and its logs around for a day
  template:
    metadata:
      labels:
        app: importer-api
        component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false # no Kubernetes API access needed, see api/20-deployment.yaml
      containers:
        - name: migrate
          image: ghcr.io/c88lopez/importer-api
          args: ["migrate", "up"]
          envFrom:
            # Not optional here: without DATABASE_URL there's nothing to migrate.
            - secretRef:
                name: importer-api-deps
          env:
            # Replaces the DATABASE_URL above (env wins over envFrom). The
            # services' URL ends in ?pool_max_conns=..., which only their pgx
            # pool understands: goose connects through database/sql, which
            # sends it on to Postgres, and Postgres refuses the connection.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: importer-api-deps
                  key: MIGRATE_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
