# A Job runs a pod to completion once, instead of keeping it running like a
# Deployment. This one applies pending database migrations before a deploy.
#
# It's in k8s/jobs/ on purpose: `kubectl apply -f k8s/` doesn't recurse, so
# `make deploy` never applies it directly. `make migrate` runs it with the
# image for $(VERSION) and waits for it, then the deploy goes ahead.
apiVersion: batch/v1
kind: Job
metadata:
  name: importer-api-migrate
  namespace: importer-api
  labels:
    app: importer-api
    component: migrate
spec:
  backoffLimit: 0 # a failed migration needs a human, not a retry
  activeDeadlineSeconds: 600 # kill a migration that hangs (e.g. waiting on a table lock)
  ttlSecondsAfterFinished: 86400 # keep the pod and its logs around for a day
  template:
    metadata:
      labels:
        app: importer-api
        component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # make migrate replaces this with the image for $(VERSION).
          image: ghcr.io/c88lopez/importer-api:1.5.0
          args: ["migrate", "up"]
          envFrom:
            # Not optional here: without DATABASE_URL there's nothing to migrate.
            - secretRef:
                name: importer-api-deps
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
