# A Service gives the pods one stable address and load-balances across the ready ones.
# It finds pods by label (selector), not by name, since pod names change on every rollout.
#
# type: NodePort exposes it on localhost:30080 with Docker Desktop.
# Inside the cluster it's also reachable at http://importer-api.importer-api.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: importer-api
  namespace: importer-api
spec:
  type: NodePort
  selector:
    app: importer-api
  ports:
    - name: http
      port: 80 # the Service's port
      targetPort: http # the container's named port (8080)
      nodePort: 30080 # the port on your machine
