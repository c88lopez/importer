# The worker has no Service: nothing calls it. It pulls work from RabbitMQ,
# and each replica gets its own share of the queue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: importer-worker
  namespace: importer
  labels:
    app: importer-worker
spec:
  # No replicas: the autoscaler sets the count (50-hpa.yaml or 60-scaledobject.yaml).
  selector:
    matchLabels:
      app: importer-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # a new pod must be consuming before an old one stops
      maxSurge: 1
  template:
    metadata:
      labels:
        app: importer-worker
    spec:
      # SIGTERM stops consuming; the message in hand gets up to 30s to finish.
      terminationGracePeriodSeconds: 45
      containers:
        - name: importer-worker
          # Built and pushed by .github/workflows/build.yml when a v* tag is pushed.
          # Argo CD deploys it through k8s/kustomization.yaml; applied on
          # its own, this file has no tag and would run :latest.
          image: ghcr.io/c88lopez/importer-worker # tag: newTag in k8s/kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            # Probes and /metrics (scraped via k8s/40-podmonitor.yaml).
            - name: metrics
              containerPort: 9464
          envFrom:
            - configMapRef:
                name: importer-worker-config
            # DATABASE_URL and RABBITMQ_URL (make secrets creates it). Not
            # optional: the worker can't do anything without them.
            - secretRef:
                name: importer-worker-deps
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532 # distroless "nonroot"; must be numeric for runAsNonRoot to verify
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
