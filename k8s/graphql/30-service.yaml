# GraphQL on http://192.168.68.57:30082/graphql, GraphiQL on
# http://192.168.68.57:30082/ (the API is on 30080, Argo CD on 30081).
apiVersion: v1
kind: Service
metadata:
  name: importer-graphql
  namespace: importer
spec:
  type: NodePort
  # Local: keep the client's IP as the request's source address. With the
  # default (Cluster), kube-proxy replaces it with a node's, and the rate
  # limiter, which counts per IP, would put every client in one bucket.
  externalTrafficPolicy: Local
  selector:
    app: importer-graphql
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30082
