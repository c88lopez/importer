# Non-secret config for importer-graphql, injected as env vars. The database,
# RabbitMQ and Redis URLs are in the importer-graphql-deps Secret (make secrets).
apiVersion: v1
kind: ConfigMap
metadata:
  name: importer-graphql-config
  namespace: importer
data:
  APP_ENV: "k8s-local"
  # Redis only holds the rate limit counts, so it's not critical: when it's
  # down, requests go through unlimited.
  CRITICAL_DEPENDENCIES: "postgres,rabbitmq"
  # Requests per client IP per window on the item endpoints, counted in Redis.
  # 0 turns limiting off (e.g. for a perf run: k6 sends everything from one IP).
  # Docker Desktop replaces every LAN client's address with its own
  # (192.168.65.x), so here this is one budget shared by all clients: set high
  # enough not to get in the way. Pods read it at start: `make restart` after a change.
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_WINDOW: "1m"
  # Send traces to Alloy, which forwards them to Tempo. Remove to turn tracing off.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc:4317"
