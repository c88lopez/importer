# Local Postgres for `make run` and the database tests. Same major version as
# the cluster (CloudNativePG postgresql:18).
#
#   make db-up     start it (data survives restarts in the pgdata volume)
#   make db-down   stop it; add -v to the compose command to wipe the data
#
# Two databases: importer for the app, importer_test for go test, which drops
# and recreates tables, so it never touches your local data.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: importer
      POSTGRES_PASSWORD: importer
      POSTGRES_DB: importer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    configs:
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/create-test-db.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "importer", "-d", "importer"]
      interval: 2s
      timeout: 2s
      retries: 15

configs:
  create-test-db:
    content: CREATE DATABASE importer_test;

volumes:
  pgdata:
